<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D ХОРРОР</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loading">ЗАГРУЗКА...</div>
    <div id="crosshair">⌖</div>
    <div id="message"></div>
    <div id="instruction">КЛИКНИ, ЧТОБЫ ИГРАТЬ | ESC — НАСТРОЙКИ</div>
    
    <!-- МЕНЮ НАСТРОЕК -->
    <div id="settingsMenu">
        <h2>НАСТРОЙКИ</h2>
        <div class="setting">
            <label>Чувствительность мыши: <span id="sensValue">1.0</span></label>
            <input type="range" id="sensitivity" min="0.1" max="3" step="0.1" value="1">
        </div>
        <div class="setting">
            <label>Обзор (FOV): <span id="fovValue">75</span></label>
            <input type="range" id="fov" min="50" max="110" step="1" value="75">
        </div>
        <div class="setting">
            <label>Яркость: <span id="brightnessValue">1.0</span></label>
            <input type="range" id="brightness" min="0.3" max="3" step="0.1" value="1">
        </div>
        <div class="setting">
            <label>Громкость фонарика: <span id="flashlightValue">12</span></label>
            <input type="range" id="flashlightPower" min="3" max="30" step="1" value="12">
        </div>
        <button id="closeSettings">ЗАКРЫТЬ (ESC)</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
